spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere_db
    username: shopsphere_user
    password: ${SHOPSPHERE_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true